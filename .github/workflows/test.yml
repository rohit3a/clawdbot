name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        claude: ['2.1.325', '2.1.330']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: clawdctl
        run: node --test tests/*.test.mjs
      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/clawd
      - name: The mod
        run: claude plugin test plugins/clawd
